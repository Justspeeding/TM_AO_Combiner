[package]
name = "tm_ao_combiner"
version = "0.1.0"
edition = "2024"
description = "TrackMania texture RGB + AO/Prelight multiply combiner"

[dependencies]
eframe = "0.31.1"
image = { version = "0.25.10", default-features = true }
image_dds = { version = "0.7.2", features = ["image", "ddsfile", "encode"] }
rfd = "0.15.4"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
